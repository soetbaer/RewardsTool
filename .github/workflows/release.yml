# Baut das Paket (pack.py) und legt das GitHub-Release vX.Y.Z an – beim Push eines Tags vX.Y.Z
# oder von Hand (Actions → Release → Run workflow; das Tag wird dann aus VERSION erzeugt).
# Assets: RewardsTool-X.Y.Z.zip (lädt der Updater) und RewardsTool.zip (gleicher Inhalt, für den festen Link
# …/releases/latest/download/RewardsTool.zip in der Anleitung). Gibt es das Release schon, werden nur
# Notes und Assets aktualisiert.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag und VERSION vergleichen
        run: |
          VERSION=$(python -c "from rewards.version import VERSION; print(VERSION)")
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu VERSION $VERSION in rewards/version.py" >&2
            exit 1
          fi
          test -f "docs/releases/$TAG.md" || { echo "docs/releases/$TAG.md fehlt" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Paket bauen
        run: |
          python pack.py
          cp "dist/RewardsTool-$VERSION.zip" dist/RewardsTool.zip

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md"
            # Versioniertes Paket nur ergänzen, falls es fehlt – sonst ändert sich die Prüfsumme für den Updater
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "RewardsTool-$VERSION.zip" \
              || gh release upload "$TAG" "dist/RewardsTool-$VERSION.zip"
            gh release upload "$TAG" dist/RewardsTool.zip --clobber
          else
            gh release create "$TAG" "dist/RewardsTool-$VERSION.zip" dist/RewardsTool.zip \
              --target "$GITHUB_SHA" \
              --title "RewardsTool $VERSION" \
              --notes-file "docs/releases/$TAG.md" \
              --latest
          fi
